<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" id="viewport-meta" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4CAF50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <title>青囊录</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Edge浏览器缩放修复 - 在页面加载前检测
    (function() {
      var ua = navigator.userAgent;
      var isEdge = /Edg|Edge/i.test(ua);
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      
      if (isEdge && isMobile) {
        var screenW = window.screen.width;
        var viewportW = window.innerWidth;
        
        // 直接设置正确的viewport
        var vp = document.getElementById('viewport-meta');
        if (vp && viewportW > 0 && screenW > viewportW * 1.05) {
          vp.setAttribute('content', 'width=' + screenW + ', initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
        }
      }
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <h1>青囊录</h1>
    <p class="subtitle">知钱财来去 明取舍得失</p>
  </header>

  <main class="app-main" id="app-main">
    <!-- 首页 -->
    <div class="page active" id="home-page">
      <div class="summary-card">
        <div class="summary-item">
          <span class="summary-label">本月支出</span>
          <span class="summary-value" id="month-total">¥0.00</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-item">
          <span class="summary-label">总支出</span>
          <span class="summary-value" id="all-total">¥0.00</span>
        </div>
      </div>

      <!-- 日历组件 -->
      <div class="calendar-card">
        <div class="calendar-header">
          <button class="calendar-nav" id="prev-month">‹</button>
          <span class="calendar-title" id="calendar-title"></span>
          <button class="calendar-nav" id="next-month">›</button>
        </div>
        <div class="calendar-weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>

      <div class="records-section">
        <div class="section-header">
          <h3>最近记录</h3>
          <button class="view-all" onclick="switchTab('list')">查看全部</button>
        </div>
        <div class="records-list" id="recent-records"></div>
      </div>
    </div>

    <!-- 添加记录页 -->
    <div class="page" id="add-page">
      <div class="form-container">
        <div class="form-group">
          <label>大类</label>
          <div class="category-grid" id="member-grid"></div>
        </div>

        <div class="form-group">
          <label>小类</label>
          <div class="category-grid" id="category-grid"></div>
        </div>

        <div class="form-group">
          <label>金额</label>
          <div class="amount-input-wrapper">
            <span class="currency-symbol">¥</span>
            <input type="number" id="amount-input" placeholder="0.00" step="0.01" min="0">
          </div>
        </div>

        <div class="form-group">
          <label>日期</label>
          <input type="date" id="date-input">
        </div>

        <div class="form-group">
          <label>备注（可选）</label>
          <input type="text" id="note-input" placeholder="添加备注...">
        </div>

        <button class="btn-save" id="btn-save">保存记录</button>
      </div>
    </div>

    <!-- 记录列表页 -->
    <div class="page" id="list-page">
      <div class="list-header">
        <input type="text" id="search-input" placeholder="搜索记录...">
        <select id="filter-member">
          <option value="">全部</option>
        </select>
        <select id="filter-category">
          <option value="">全部</option>
        </select>
      </div>
      <div class="records-list" id="all-records"></div>
    </div>

    <!-- 统计页 -->
    <div class="page" id="stats-page">
      <!-- 时间选择 -->
      <div class="stats-date-selector">
        <div class="date-toggle">
          <button class="date-btn active" data-period="month">月</button>
          <button class="date-btn" data-period="year">年</button>
        </div>
        <div class="date-navigation">
          <button class="date-nav-btn" id="stats-prev">‹</button>
          <span class="date-display" id="stats-date-display"></span>
          <button class="date-nav-btn" id="stats-next">›</button>
        </div>
      </div>
      
      <!-- 分类维度选择 -->
      <div class="stats-tabs">
        <button class="stats-tab active" data-type="member">大类</button>
        <button class="stats-tab" data-type="category">小类</button>
      </div>
      
      <!-- 环状图 -->
      <div class="chart-container">
        <canvas id="pie-chart" width="280" height="280"></canvas>
        <div class="chart-center-info">
          <div class="chart-center-label" id="chart-center-label">总支出</div>
          <div class="chart-center-value" id="chart-center-value">¥0.00</div>
        </div>
      </div>
      
      <!-- 分类明细列表 -->
      <div class="stats-categories" id="stats-categories"></div>
      
      <!-- 展开的明细 -->
      <div class="stats-detail" id="stats-detail"></div>
    </div>

    <!-- 设置页 -->
    <div class="page" id="settings-page">
      <div class="settings-section">
        <h3>分类管理</h3>
        <div class="settings-item" id="manage-categories">
          <div class="settings-info">
            <span class="settings-title">管理大类和小类</span>
            <span class="settings-desc">添加、编辑、删除大类和小类</span>
          </div>
          <span class="settings-arrow">›</span>
        </div>
      </div>

      <div class="settings-section">
        <h3>数据管理</h3>
        <div class="settings-item" onclick="exportData()">
          <div class="settings-info">
            <span class="settings-title">导出JSON备份</span>
            <span class="settings-desc">导出记账记录和大类小类配置</span>
          </div>
          <button class="btn-action">导出</button>
        </div>
        <div class="settings-item" onclick="exportExcel()">
          <div class="settings-info">
            <span class="settings-title">导出Excel</span>
            <span class="settings-desc">导出账单为Excel表格格式</span>
          </div>
          <button class="btn-action">导出Excel</button>
        </div>
        <div class="settings-item" onclick="triggerImport()">
          <div class="settings-info">
            <span class="settings-title">导入</span>
            <span class="settings-desc">导入记账记录和大类小类配置</span>
          </div>
          <button class="btn-action">选择文件</button>
        </div>
        <input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImport(event)">
        <div class="settings-item" onclick="clearAllData()">
          <div class="settings-info">
            <span class="settings-title" style="color:#f44336">清空所有数据</span>
            <span class="settings-desc" style="color:#999">删除所有记账记录，操作不可恢复</span>
          </div>
          <button class="btn-action btn-danger">清空</button>
        </div>
      </div>

      <div class="settings-section">
        <h3>关于</h3>
        <div class="settings-item">
          <div class="settings-info">
            <span class="settings-title">青囊录 v3.0</span>
            <span class="settings-desc">知钱财来去，明取舍得失</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="home" onclick="switchTab('home')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">首页</span>
    </button>
    <button class="nav-btn nav-btn-main" data-tab="add" onclick="switchTab('add')">
      <span class="nav-icon">+</span>
      <span class="nav-label">记账</span>
    </button>
    <button class="nav-btn" data-tab="list" onclick="switchTab('list')">
      <span class="nav-icon">📋</span>
      <span class="nav-label">记录</span>
    </button>
    <button class="nav-btn" data-tab="stats" onclick="switchTab('stats')">
      <span class="nav-icon">📊</span>
      <span class="nav-label">统计</span>
    </button>
    <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">设置</span>
    </button>
  </nav>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
