<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4CAF50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <title>家庭记账本</title>
  <style>
    /* 基础样式 */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { 
      width: 100%; 
      height: 100%; 
      overflow-x: hidden; 
      margin: 0; 
      padding: 0;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    /* 缩放容器 - 用于动态修正PWA缩放 */
    #app-wrapper {
      width: 100%;
      transform-origin: top left;
      will-change: transform;
    }
  </style>
  <link rel="stylesheet" href="style.css">
  <script>
    // 动态修复PWA缩放
    (function() {
      function fixScale() {
        var wrapper = document.getElementById('app-wrapper');
        if (!wrapper) return;
        
        // 获取实际屏幕宽度和窗口宽度
        var screenWidth = window.screen.width;
        var windowWidth = window.innerWidth;
        var documentWidth = document.documentElement.clientWidth;
        
        // 计算缩放比例
        var scale = 1;
        
        // 检查是否在PWA独立模式
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                          window.navigator.standalone === true;
        
        if (isStandalone && windowWidth < screenWidth * 0.8) {
          // PWA模式 - 可能需要放大
          scale = screenWidth / windowWidth;
          // 限制在合理范围
          scale = Math.max(1, Math.min(scale, 2));
        }
        
        // 应用缩放
        wrapper.style.transform = 'scale(' + scale + ')';
        wrapper.style.width = (100 / scale) + '%';
        
        // 调整body高度
        document.body.style.minHeight = (window.innerHeight / scale) + 'px';
      }
      
      // DOM就绪后执行
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fixScale);
      } else {
        fixScale();
      }
      
      // 多次延迟执行确保生效
      setTimeout(fixScale, 100);
      setTimeout(fixScale, 300);
      setTimeout(fixScale, 500);
      setTimeout(fixScale, 1000);
      
      // 监听窗口变化
      window.addEventListener('resize', fixScale);
      window.addEventListener('orientationchange', fixScale);
      
      // 页面完全加载后再执行
      window.addEventListener('load', fixScale);
    })();
  </script>
</head>
<body>
  <div id="app-wrapper">
  <header class="app-header">
    <h1>家庭记账本</h1>
    <p class="subtitle">记录每一笔开销</p>
  </header>

  <main class="app-main" id="app-main">
    <!-- 首页 -->
    <div class="page active" id="home-page">
      <div class="summary-card">
        <div class="summary-item">
          <span class="summary-label">本月支出</span>
          <span class="summary-value" id="month-total">¥0.00</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-item">
          <span class="summary-label">总支出</span>
          <span class="summary-value" id="all-total">¥0.00</span>
        </div>
      </div>

      <div class="quick-actions">
        <button class="quick-btn" onclick="switchTab('add')">
          <span class="quick-icon">+</span>
          <span>快速记账</span>
        </button>
        <button class="quick-btn" onclick="switchTab('stats')">
          <span class="quick-icon">📊</span>
          <span>统计报表</span>
        </button>
      </div>

      <div class="records-section">
        <div class="section-header">
          <h3>最近记录</h3>
          <button class="view-all" onclick="switchTab('list')">查看全部</button>
        </div>
        <div class="records-list" id="recent-records"></div>
      </div>
    </div>

    <!-- 添加记录页 -->
    <div class="page" id="add-page">
      <div class="form-container">
        <div class="form-group">
          <label>选择大类（成员）</label>
          <div class="category-grid" id="member-grid"></div>
        </div>

        <div class="form-group">
          <label>选择小类（分类）</label>
          <div class="category-grid" id="category-grid"></div>
        </div>

        <div class="form-group">
          <label>金额</label>
          <div class="amount-input-wrapper">
            <span class="currency-symbol">¥</span>
            <input type="number" id="amount-input" placeholder="0.00" step="0.01" min="0">
          </div>
        </div>

        <div class="form-group">
          <label>日期</label>
          <input type="date" id="date-input">
        </div>

        <div class="form-group">
          <label>备注（可选）</label>
          <input type="text" id="note-input" placeholder="添加备注...">
        </div>

        <button class="btn-save" id="btn-save">保存记录</button>
      </div>
    </div>

    <!-- 记录列表页 -->
    <div class="page" id="list-page">
      <div class="list-header">
        <input type="text" id="search-input" placeholder="搜索记录...">
        <select id="filter-member">
          <option value="">全部大类</option>
        </select>
        <select id="filter-category">
          <option value="">全部小类</option>
        </select>
      </div>
      <div class="records-list" id="all-records"></div>
    </div>

    <!-- 统计页 -->
    <div class="page" id="stats-page">
      <div class="stats-tabs">
        <button class="stats-tab active" data-type="member">按大类</button>
        <button class="stats-tab" data-type="category">按小类</button>
      </div>
      <div class="stats-content" id="stats-content"></div>
    </div>

    <!-- 设置页 -->
    <div class="page" id="settings-page">
      <div class="settings-section">
        <h3>分类管理</h3>
        <div class="settings-item" onclick="window.location.href='#'" id="manage-categories">
          <div class="settings-info">
            <span class="settings-title">管理大类和小类</span>
            <span class="settings-desc">添加、编辑、删除大类和小类</span>
          </div>
          <span class="settings-arrow">›</span>
        </div>
      </div>

      <div class="settings-section">
        <h3>数据管理</h3>
        <div class="settings-item" onclick="exportData()">
          <div class="settings-info">
            <span class="settings-title">导出</span>
            <span class="settings-desc">导出记账记录和大类小类配置</span>
          </div>
          <button class="btn-action">导出</button>
        </div>
        <div class="settings-item" onclick="document.getElementById('import-input').click()">
          <div class="settings-info">
            <span class="settings-title">导入</span>
            <span class="settings-desc">导入记账记录和大类小类配置</span>
          </div>
          <button class="btn-action">选择文件</button>
        </div>
        <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
        <div class="settings-item" onclick="clearAllData()">
          <div class="settings-info">
            <span class="settings-title" style="color:#f44336">清空所有数据</span>
            <span class="settings-desc" style="color:#999">删除所有记账记录，操作不可恢复</span>
          </div>
          <button class="btn-action btn-danger">清空</button>
        </div>
      </div>

      <div class="settings-section">
        <h3>关于</h3>
        <div class="settings-item">
          <div class="settings-info">
            <span class="settings-title">家庭记账本 v2.1</span>
            <span class="settings-desc">家庭成员记账 · 数据存本地 · 数据可迁移</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="home" onclick="switchTab('home')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">首页</span>
    </button>
    <button class="nav-btn nav-btn-main" data-tab="add" onclick="switchTab('add')">
      <span class="nav-icon">+</span>
      <span class="nav-label">记账</span>
    </button>
    <button class="nav-btn" data-tab="list" onclick="switchTab('list')">
      <span class="nav-icon">📋</span>
      <span class="nav-label">记录</span>
    </button>
    <button class="nav-btn" data-tab="stats" onclick="switchTab('stats')">
      <span class="nav-icon">📊</span>
      <span class="nav-label">统计</span>
    </button>
    <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">设置</span>
    </button>
  </nav>

  <!-- 分类管理弹窗 -->
  <div class="modal" id="category-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>管理大类和小类</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-tabs">
          <button class="modal-tab active" data-tab="members">大类管理</button>
          <button class="modal-tab" data-tab="categories">小类管理</button>
        </div>
        <div class="modal-content-area" id="modal-members"></div>
        <div class="modal-content-area" id="modal-categories" style="display:none"></div>
      </div>
    </div>
  </div>

  <!-- 编辑记录弹窗 -->
  <div class="modal" id="edit-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>编辑记录</h2>
        <button class="modal-close" onclick="closeEditModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>选择大类</label>
          <div class="category-grid" id="edit-member-grid"></div>
        </div>
        <div class="form-group">
          <label>选择小类</label>
          <div class="category-grid" id="edit-category-grid"></div>
        </div>
        <div class="form-group">
          <label>金额</label>
          <div class="amount-input-wrapper">
            <span class="currency-symbol">¥</span>
            <input type="number" id="edit-amount" step="0.01" min="0">
          </div>
        </div>
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="edit-date">
        </div>
        <div class="form-group">
          <label>备注</label>
          <input type="text" id="edit-note">
        </div>
        <button class="btn-save" onclick="saveEditRecord()">保存修改</button>
      </div>
    </div>
  </div>

  </div>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
